server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: aives-backend
  profiles:
    active: dev

  # DataSource (PostgreSQL 16 - Neon)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-block-b3yhbez5-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_P7CZhEKTy2Dp}
    driver-class-name: org.postgresql.Driver

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # JPA & Hibernate Configuration
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # Multipart Upload Configuration for Audio Blobs
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

# AIVES System Configuration
aives:
  # AI Provider Layer (STT, TTS, LLM)
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    google-cloud-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
    stt-provider: ${STT_PROVIDER:whisper}       # whisper (default) | google
    tts-provider: ${TTS_PROVIDER:google}        # google (default) | fpt
    llm-provider: ${LLM_PROVIDER:openai}        # openai (default) | gemini
    llm-model: ${LLM_MODEL:gpt-4o}

  # Audio Ingestion & Storage
  audio:
    mode: ${AUDIO_MODE:BUFFERED}                # BUFFERED (default) | STREAMING
    storage-path: ${AUDIO_STORAGE_PATH:./uploads/audio}
    max-duration-seconds: 120

  # Real-time Viva Interview Session
  interview:
    heartbeat-interval-seconds: 15
    heartbeat-timeout-seconds: 60

  # CORS Configuration (Frontend: React 18 + Vite)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

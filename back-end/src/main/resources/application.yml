server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: aives-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ==============================================================================
  # CẤU HÌNH DATABASE (Chỉnh sửa trực tiếp tại đây)
  # ==============================================================================
  datasource:
    # --- LỰA CHỌN 1: Database Cloud (Neon PostgreSQL) [ĐANG BẬT] ---
    # url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-block-b3yhbez5-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
    # username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    # password: ${SPRING_DATASOURCE_PASSWORD:npg_P7CZhEKTy2Dp}

    # --- LỰA CHỌN 2: Database Local (Docker / PostgreSQL máy tính) ---
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aives_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

    driver-class-name: org.postgresql.Driver

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Untracked databases must already match database/lastScriptDB.sql (schema version 4).
    # Tracked V1-V3 databases are upgraded by V4; empty databases use B4.
    baseline-version: 4
    locations: classpath:db/migration

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # SMTP (Gmail app password). MAIL_USERNAME + MAIL_PASSWORD override the default sender.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # Multipart Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

# AIVES System Configuration
aives:
  # Password setup / reset links sent by email
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@aives.local}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    password-link-hours: 72
    # Local development only: write the link to the log when SMTP is not configured.
    log-links: ${MAIL_LOG_LINKS:false}

  # CORS Configuration (Frontend: React 18 + Vite)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Logging Configuration
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

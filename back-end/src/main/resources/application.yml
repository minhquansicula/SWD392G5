server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: aives-backend
  profiles:
    active: local

  # DataSource (PostgreSQL 16)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aives_db}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Untracked databases must already match database/lastScriptDB.sql (schema version 4).
    # Tracked V1-V3 databases are upgraded by V4; empty databases use B4.
    baseline-version: 4
    locations: classpath:db/migration

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # SMTP (Gmail app password). MAIL_USERNAME + MAIL_PASSWORD override the default sender.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:datntse180352@fpt.edu.vn}
    password: ${MAIL_PASSWORD:zxhu srax smxw zayl}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # Multipart Upload Configuration for Audio Blobs
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

# AIVES System Configuration
aives:
  # AI Provider Layer (STT, TTS, LLM)
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    google-cloud-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
    stt-provider: ${STT_PROVIDER:whisper}       # whisper (default) | google
    tts-provider: ${TTS_PROVIDER:google}        # google (default) | fpt
    llm-provider: ${LLM_PROVIDER:openai}        # openai (default) | gemini
    llm-model: ${LLM_MODEL:gpt-4o}

  # Password setup / reset links sent by email
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:datntse180352@fpt.edu.vn}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    password-link-hours: 72
    # Local development only: write the link to the log when SMTP is not configured.
    log-links: ${MAIL_LOG_LINKS:false}

  # Audio Ingestion & Storage
  audio:
    mode: ${AUDIO_MODE:BUFFERED}                # BUFFERED (default) | STREAMING
    storage-path: ${AUDIO_STORAGE_PATH:./uploads/audio}
    max-duration-seconds: 120

  # Real-time Viva Interview Session
  interview:
    heartbeat-interval-seconds: 15
    heartbeat-timeout-seconds: 60

  # CORS Configuration (Frontend: React 18 + Vite)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

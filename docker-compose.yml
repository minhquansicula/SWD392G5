services:
  # =========================================================================
  # 🐘 PostgreSQL 16 with pgvector Extension (AIVES Database)
  # =========================================================================
  # Tự động nạp toàn bộ Schema và Seed Data từ thư mục database/docker-init/
  # Mỗi lần chạy down -v và up lại sẽ tự động drop/create dữ liệu hoàn toàn mới.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aives-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: aives_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aives_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - aives-network

networks:
  aives-network:
    driver: bridge

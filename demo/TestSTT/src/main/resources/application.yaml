server:
  port: 8081

spring:
  application:
    name: TestSTT

  # Multipart upload cho file audio
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# ──────────── AI Configuration (STT & LLM) ────────────
aives:
  ai:
    # Mặc định dùng gemini hoặc groq
    default-llm-provider: ${DEFAULT_LLM_PROVIDER:gemini}
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      stt-model: ${GROQ_STT_MODEL:whisper-large-v3}
      llm-model: ${GROQ_LLM_MODEL:openai/gpt-oss-120b}
      language: vi
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  audio:
    storage-path: ${AUDIO_STORAGE_PATH:./uploads/audio}

# Logging
logging:
  level:
    root: INFO
    com.teststt: DEBUG
    org.springframework.web: INFO
